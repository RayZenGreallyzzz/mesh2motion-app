<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111216" />
    <link rel="icon" type="image/png" href="./images/branding/hedgehog-icon.png" />
    <link rel="preload" as="image" href="./images/branding/hedgehog-splash.webp" />
    <title>Rig Animation Studio</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden; background: #111216; color: #fff2dc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .launch {
        width: 100%; height: 100%; height: 100dvh;
        display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
        justify-items: center; gap: 16px;
        padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: radial-gradient(ellipse at 50% 53%, #4c182580 0%, #25171d50 35%, transparent 68%);
      }
      .title { text-align: center; align-self: end; }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 56px); line-height: 1.05; font-weight: 900; letter-spacing: .08em; }
      h1 span { display: block; margin-top: 9px; font-size: .29em; font-weight: 600; letter-spacing: .3em; color: #d8b579; }
      .mascot { width: 100%; height: 100%; min-height: 0; max-width: 670px; object-fit: contain; filter: drop-shadow(0 18px 20px #0008); }
      .footer { display: grid; justify-items: center; gap: 10px; }
      .line { width: 116px; height: 2px; background: linear-gradient(90deg, transparent, #c62631, #e9bd65, transparent); }
      .status { margin: 0; color: #b8afb0; font-size: 12px; letter-spacing: .04em; }
      .enter { min-height: 44px; display: grid; place-items: center; padding: 8px 18px; color: #e9bd82; font-size: 12px; text-decoration: none; }
      .enter:focus-visible { outline: 2px solid #e9bd82; border-radius: 8px; }
      @media (orientation: landscape) and (min-width: 600px) {
        .launch { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: 1fr 1fr; gap: 12px 24px; padding-block: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-bottom)); }
        .mascot { grid-column: 1; grid-row: 1 / 3; justify-self: end; }
        .title { grid-column: 2; grid-row: 1; justify-self: start; text-align: left; }
        .footer { grid-column: 2; grid-row: 2; justify-self: start; align-self: start; justify-items: start; padding-top: 18px; }
        h1 { font-size: clamp(28px, 5vw, 60px); }
        .enter { padding-left: 0; }
      }
      @media (max-height: 600px) and (orientation: portrait) {
        .launch { padding-block: 16px 10px; gap: 8px; }
        h1 { font-size: 30px; }
        .footer { gap: 5px; }
      }
    </style>
  </head>
  <body>
    <main class="launch" aria-label="Rig Animation Studio">
      <div class="title"><h1>RIG<span>ANIMATION STUDIO</span></h1></div>
      <img class="mascot" src="./images/branding/hedgehog-splash.webp" alt="Ёж в красной бандане с битой" fetchpriority="high" />
      <div class="footer">
        <div class="line" aria-hidden="true"></div>
        <p class="status" role="status">Открываем студию…</p>
        <a class="enter" href="./create.html">Открыть сейчас →</a>
      </div>
    </main>
    <script>
      const launch_started = performance.now()
      const open_studio = () => window.location.replace('./create.html')
      // A broken image must never block access to the editor.
      window.setTimeout(open_studio, 2800)
      const mascot = document.querySelector('.mascot')
      mascot.decode().catch(() => {}).then(() => {
        window.setTimeout(open_studio, Math.max(0, 1100 - (performance.now() - launch_started)))
      })
    </script>
  </body>
</html>
