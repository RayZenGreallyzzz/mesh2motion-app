<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111216" />
    <title>Rig Animation Studio</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(255,122,26,.18), transparent 34%),
          linear-gradient(180deg, #17191f 0%, #0d0e12 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f6f7fb;
      }
      .launch {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        transform: translateY(-2vh);
      }
      .mark {
        width: 82px;
        height: 82px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -2px;
        color: #1a0c04;
        background: radial-gradient(circle at 35% 28%, #ffd49a 0, #ff8a24 42%, #d74514 72%, #451006 100%);
        box-shadow: 0 16px 42px rgba(0,0,0,.38), 0 0 30px rgba(255,122,26,.18), inset 0 0 0 1px rgba(255,255,255,.18);
      }
      h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); letter-spacing: .03em; }
      p { margin: 0; opacity: .62; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
      .line { width: 150px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, #ff7a1a, transparent); opacity: .75; }
    </style>
  </head>
  <body>
    <main class="launch" aria-label="Rig Animation Studio">
      <div class="mark">RA</div>
      <h1>Rig Animation Studio</h1>
      <div class="line"></div>
      <p>Mobile Rig &amp; Animation</p>
    </main>
    <script>
      window.setTimeout(() => window.location.replace('./create.html'), 260)
    </script>
  </body>
</html>
