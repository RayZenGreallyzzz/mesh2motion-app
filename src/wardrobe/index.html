<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Студия одежды</title>
</head>
<body>
<header>
  <div class="title"><span class="brand-mark" aria-hidden="true">◈</span><div><h1>Студия одежды</h1><p id="character-state">Персонаж не загружен</p></div></div>
  <nav aria-label="Проект">
    <button id="load-model">Открыть персонажа</button>
    <button id="export" class="accent" disabled>Экспорт GLB</button>
  </nav>
</header>
<main>
  <section class="stage" aria-label="3D-примерочная">
    <div id="viewport"></div>
    <div class="stage-tools" hidden>
      <button id="front" aria-label="Вид спереди">Спереди</button>
      <button id="side" aria-label="Вид сбоку">Сбоку</button>
    </div>
    <div id="empty">
      <div class="hero-mark" aria-hidden="true">◈</div>
      <h2>Откройте персонажа с ригом</h2>
      <p>Загрузите GLB из Rig Animation Studio или примерьте одежду на учебном персонаже.</p>
      <button id="demo" class="accent">Открыть учебного персонажа</button>
    </div>
    <div id="playback" hidden>
      <button id="toggle-play" aria-label="Воспроизвести или поставить на паузу">▶</button>
      <select id="clips" aria-label="Анимация персонажа"></select>
      <input id="timeline" type="range" min="0" max="0" value="0" step=".01" aria-label="Кадр анимации">
      <output id="time">0.00 с</output>
    </div>
    <div id="message" role="status" aria-live="polite" hidden></div>
  </section>
  <aside>
    <div class="tabs" role="group" aria-label="Режим работы">
      <button id="fitting" aria-pressed="true">Подгонка</button><button id="motion" aria-pressed="false" disabled>В движении</button>
    </div>
    <section class="panel">
      <h2>Гардероб</h2>
      <div class="row">
        <button id="add-glb" disabled>Добавить GLB</button><button id="add-pattern" disabled>Выкройка SVG</button>
      </div>
      <div class="row">
        <select id="template" aria-label="Шаблон одежды" disabled></select><button id="add-template" disabled>Создать</button>
      </div>
      <div id="outfits" aria-label="Вещи"></div>
    </section>
    <section id="details" class="panel" hidden>
      <h2 id="item-name">Вещь</h2>
      <div id="piece-row" class="row"><label for="piece">Деталь</label><select id="piece"></select></div>
      <div class="row"><button id="wear">Надеть</button><button id="delete">Удалить</button></div>
      <div id="fit-tools">
        <div class="row tools">
          <button id="move" aria-pressed="true">Сдвиг</button><button id="rotate">Поворот</button><button id="scale">Масштаб</button><button id="orbit">Камера</button>
        </div>
        <div class="row" id="alignment" hidden>
          <select id="anchor" aria-label="Место одежды"><option value="torso">Корпус</option><option value="hips">Таз</option><option value="feet">Стопы</option><option value="left">Левая кисть</option><option value="right">Правая кисть</option></select>
          <button id="center">Совместить</button>
        </div>
        <label class="slider">Посадка <output id="ease-value"></output><input id="ease" type="range" min="0.3" max="5" value="1.3" step=".1"></label>
        <label class="slider">Ширина <output id="width-value"></output><input id="width" type="range" min="65" max="190" value="100" step="1"></label>
        <label class="slider">Длина <output id="length-value"></output><input id="length" type="range" min="55" max="160" value="100" step="1"></label>
        <button id="reshape" hidden>Применить форму шаблона</button>
        <div class="brush">
          <h3>Кисть посадки</h3>
          <div class="row tools"><button id="tighten">Приталить</button><button id="loosen">Оттянуть</button><button id="undo" disabled>Отмена мазка</button></div>
          <label class="slider">Размер <output id="radius-value"></output><input id="radius" type="range" min=".8" max="18" value="6" step=".2"></label>
          <label class="slider">Сила <output id="strength-value"></output><input id="strength" type="range" min="5" max="100" value="30"></label>
        </div>
        <div class="row">
          <label for="color">Цвет</label><input id="color" type="color" aria-label="Цвет одежды" value="#3d9281">
          <button id="texture">Текстура</button>
        </div>
        <label class="rig-option">Привязка<select id="binding"><option value="soft">Гибкая ткань</option><option value="rigid">Жёсткая пластина</option></select></label>
        <label id="bone-row" class="rig-option" hidden>Кость<select id="bone" aria-label="Кость крепления"></select></label>
        <button id="bind" class="accent wide">Рассчитать веса и примерить</button>
      </div>
    </section>
  </aside>
</main>
<input id="body-file" type="file" accept=".glb,model/gltf-binary" hidden>
<input id="garment-file" type="file" accept=".glb,model/gltf-binary" multiple hidden>
<input id="pattern-file" type="file" accept=".svg,image/svg+xml" hidden>
<input id="texture-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<dialog id="save-dialog">
  <form method="dialog">
    <h2>Сохранить GLB</h2>
    <p>Сохраняются надетые вещи. Отдельная вещь сохраняется со скелетом.</p>
    <div class="row"><button value="item">Текущую вещь</button><button value="all" class="accent">Персонажа в одежде</button><button value="cancel">Отмена</button></div>
  </form>
</dialog>
<dialog id="pattern-dialog"></dialog>
<script type="module" src="./main.ts"></script>
</body>
</html>
