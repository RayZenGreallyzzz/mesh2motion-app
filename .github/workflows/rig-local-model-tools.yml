name: Local private-model browser tooling
on:
  push:
    branches: [test/rig-private-model-runner-20261105]
permissions:
  contents: read
jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Package the preinstalled public Chrome runtime
        run: |
          browser=/opt/google/chrome/chrome
          test -x "$browser"
          mkdir -p browser-runtime/chrome browser-runtime/lib
          cp -a "$(dirname "$browser")/." browser-runtime/chrome/
          "$browser" --version > browser-runtime/VERSION
          ldd "$browser" | awk '$2 == "=>" && $3 ~ /^\// { print $1, $3 }' | while read -r name source; do
            case "$name" in libc.so*|libm.so*|libdl.so*|librt.so*|libpthread.so*|libresolv.so*|ld-linux*) continue;; esac
            cp -L "$source" "browser-runtime/lib/$name"
          done
          tar -czf Rig-Local-Browser.tgz -C browser-runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: Rig-Local-Browser
          path: Rig-Local-Browser.tgz
          compression-level: 0
          retention-days: 1
