name: Local private-model browser tooling
on:
  push:
    branches: [test/rig-private-model-runner-20261105]
permissions:
  contents: read
jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare public browser runtime
        run: |
          npm install --prefix local-tools --no-audit --no-fund playwright@1.62.1
          ./local-tools/node_modules/.bin/playwright install --with-deps --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell | head -n 1)
          test -n "$browser"
          mkdir -p browser-runtime/chrome browser-runtime/lib
          cp -a "$(dirname "$browser")/." browser-runtime/chrome/
          ldd "$browser" | awk '$2 == "=>" && $3 ~ /^\// { print $1, $3 }' | while read -r name source; do
            case "$name" in libc.so*|libm.so*|libdl.so*|librt.so*|libpthread.so*|libresolv.so*|ld-linux*) continue;; esac
            cp -L "$source" "browser-runtime/lib/$name"
          done
          tar -czf Rig-Local-Browser-1.62.1.tgz -C browser-runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: Rig-Local-Browser-1.62.1
          path: Rig-Local-Browser-1.62.1.tgz
          compression-level: 0
          retention-days: 1
