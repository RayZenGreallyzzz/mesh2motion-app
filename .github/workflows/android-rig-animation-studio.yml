name: Rig Animation Studio Android APK

on:
  push:
    branches:
      - android-rig-animation-studio
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        run: npm ci

      - name: Bundle offline DRACO decoder
        run: |
          mkdir -p static/draco
          cp -R node_modules/three/examples/jsm/libs/draco/. static/draco/

      - name: Apply existing Android rig fixes
        run: node scripts/apply-android-v3-fixes.mjs

      - name: Apply browser skinning + humanoid AutoRig
        run: node scripts/apply-v46-browser-autorig.mjs

      - name: Prepatch manual weight heatmap
        run: node scripts/prepatch-manual-weight-heatmap.mjs

      - name: Apply manual weight editor
        run: node scripts/apply-manual-weight-editor.mjs

      - name: Polish manual weight brush
        run: node scripts/apply-manual-weight-polish.mjs

      - name: Apply post-bind weight workflow
        run: node scripts/apply-weight-skin-workflow-v45.mjs

      - name: Fix shared skinned resource lifetime
        run: node scripts/apply-weight-shared-resource-fix.mjs

      - name: Normalize v4.7 weight panel
        run: node scripts/prepatch-v47-panel.mjs

      - name: Apply v4.7 weight diagnostics + clothing guard
        run: node scripts/apply-weight-diagnostics-v47b.mjs

      - name: Apply v4.8 canonical rig transform
        run: node scripts/apply-v48-canonical-rig-transform.mjs

      - name: Normalize Rig Animation Studio markup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'src/create.html'
          let html = fs.readFileSync(path, 'utf8')
          html = html.replace('    </nav>\n    </nav>\n', '    </nav>\n')
          fs.writeFileSync(path, html)
          NODE

      - name: Commit generated source fixes if needed
        run: |
          if git diff --quiet -- src; then
            echo "No generated source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src
            git commit -m "Apply Rig Animation Studio generated fixes"
            git push origin HEAD:android-rig-animation-studio
          fi

      - name: Install Capacitor 8
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build web app
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Rig-Animation-Studio-v4.8-Canonical-Bind-debug.apk

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rig-animation-studio-v4.8"
          APK="artifacts/Rig-Animation-Studio-v4.8-Canonical-Bind-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Rig Animation Studio v4.8" \
              --notes "Android test build: canonical browser-style bind orientation. Global Rig Setup transform stays outside the armature so animation quaternions do not fight a baked root rotation."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rig-Animation-Studio-v4.8-Canonical-Bind-APK
          path: artifacts/Rig-Animation-Studio-v4.8-Canonical-Bind-debug.apk
          if-no-files-found: error
          retention-days: 14
