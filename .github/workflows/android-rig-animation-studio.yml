name: Rig Animation Studio Android APK

on:
  push:
    branches:
      - android-rig-animation-studio
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        run: npm ci

      - name: Bundle offline DRACO decoder
        run: |
          mkdir -p static/draco
          cp -R node_modules/three/examples/jsm/libs/draco/. static/draco/

      - name: Normalize generated v2 markup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'src/create.html'
          let html = fs.readFileSync(path, 'utf8')
          html = html.replace('    </nav>\n    </nav>\n', '    </nav>\n')
          fs.writeFileSync(path, html)
          NODE

      - name: Commit markup cleanup if needed
        run: |
          if git diff --quiet -- src; then
            echo "No v2 source cleanup needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src
            git commit -m "Clean Rig Animation Studio v2 markup"
            git push origin HEAD:android-rig-animation-studio
          fi

      - name: Install Capacitor 8
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build web app
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Rig-Animation-Studio-v2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rig-Animation-Studio-v2-APK
          path: artifacts/Rig-Animation-Studio-v2-debug.apk
          if-no-files-found: error
          retention-days: 14
