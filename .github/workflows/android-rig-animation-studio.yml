name: Rig Animation Studio Android APK

on:
  push:
    branches:
      - android-rig-animation-studio
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        run: npm ci

      - name: Bundle offline DRACO decoder
        run: |
          mkdir -p static/draco
          cp -R node_modules/three/examples/jsm/libs/draco/. static/draco/

      - name: Apply v5.6 depth-aware 3D AutoRig
        run: node scripts/apply-v56-depth-aware-autorig.mjs

      - name: Normalize Rig Animation Studio markup
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'src/create.html'
          let html = fs.readFileSync(path, 'utf8')
          html = html.replace('    </nav>\n    </nav>\n', '    </nav>\n')
          fs.writeFileSync(path, html)
          NODE

      - name: Commit generated source fixes if needed
        run: |
          if git diff --quiet -- src; then
            echo "No generated source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src
            git commit -m "Apply Rig Animation Studio generated fixes"
            git push origin HEAD:android-rig-animation-studio
          fi

      - name: Install Capacitor 8
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build web app
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Rig-Animation-Studio-v5.8.1-Source-Axes-debug.apk

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rig-animation-studio-v5.8.1-source-axes"
          APK="artifacts/Rig-Animation-Studio-v5.8.1-Source-Axes-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Rig Animation Studio v5.8.1 Source Axes Baseline" \
              --notes "Root-cause baseline: preserves fitted joint positions while restoring the original Human local bone quaternions before bind. Built-in Human clips play directly without retargeting. Includes strict solver-vs-bind bone index and transform sanity assertions."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rig-Animation-Studio-v5.8.1-Source-Axes-APK
          path: artifacts/Rig-Animation-Studio-v5.8.1-Source-Axes-debug.apk
          if-no-files-found: error
          retention-days: 14
