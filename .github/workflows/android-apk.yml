name: Mesh2Motion Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Run weight-skinning regression tests
        run: npm test -- --run
      - name: Build offline web application
        run: npm run build
      - name: Bundle web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mesh2Motion-Android-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
