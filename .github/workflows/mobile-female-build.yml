name: Mobile Female Rig Build

on:
  push:
    branches:
      - mobile-female-rig
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Apply Mobile Female humanoid patches
        run: node scripts/apply-mobile-female-patches.mjs
      - name: Commit generated patch changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No generated patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Apply Mobile Female humanoid pipeline patches"
          git push
      - run: npm run build
      - run: npm test -- --run
