name: Rig Animation Studio v6.4 Safety APK

on:
  push:
    branches:
      - fix/rig-studio-bind-and-skin-v64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Run full regression tests
        run: npm test -- --run
      - name: Build web assets
        run: |
          mkdir -p static/draco
          cp -R node_modules/three/examples/jsm/libs/draco/. static/draco/
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Capacitor install
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - name: Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload TEST APK only (never overwrite v6.1 release)
        uses: actions/upload-artifact@v4
        with:
          name: Rig-Animation-Studio-v6.4-Safety-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
