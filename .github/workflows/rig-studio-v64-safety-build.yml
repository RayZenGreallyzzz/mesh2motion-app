name: Rig Animation Studio v6.4 Safety APK

on:
  push:
    branches:
      - fix/rig-studio-bind-and-skin-v64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Run full regression tests
        run: npm test -- --run
      - name: Build web assets
        run: |
          mkdir -p static/draco
          cp -R node_modules/three/examples/jsm/libs/draco/. static/draco/
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Capacitor install
        run: npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - name: Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Keep original Rig Animation Studio installed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          app_id = 'com.rayzen.riganimationstudio'
          new_id = app_id + '.v64test'
          updated, count = re.subn(
              r'(applicationId\\s+[\\x22\\x27])' + re.escape(app_id) + r'([\\x22\\x27])',
              lambda m: m.group(1) + new_id + m.group(2),
              text,
          )
          if count != 1:
              raise RuntimeError(f'Expected one applicationId={app_id}, got {count}; refusing to overwrite installed v6.3')
          gradle.write_text(updated)
          names = Path('android/app/src/main/res/values/strings.xml')
          if names.exists():
              names.write_text(names.read_text().replace('Rig Animation Studio', 'Rig Studio v6.4 TEST'))
          print('Distinct Android test applicationId:', new_id)
          PY
      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload TEST APK only (never overwrite v6.1 release)
        uses: actions/upload-artifact@v4
        with:
          name: Rig-Animation-Studio-v6.4-Safety-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
