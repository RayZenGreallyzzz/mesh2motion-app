plugins { id 'com.android.application' }

android {
    namespace 'org.mesh2motion.android'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'org.mesh2motion.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}

tasks.register('syncWebAssets', Sync) {
    from '../../dist'
    from('../../LICENSE-MIT.MD') { into 'licenses' }
    from('../../LICENSE-CC0.MD') { into 'licenses' }
    into layout.buildDirectory.dir('generated/webAssets')
    exclude '**/*.map', 'test-files/**', 'survey/**'
    doFirst {
        if (!file('../../dist/create.html').exists()) {
            throw new GradleException('Build the web app first: npm ci && npm run build')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
